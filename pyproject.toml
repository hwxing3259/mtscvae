[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtvae"
version = "0.1.0"
description = "Multimodal temporal integration of unpaired single-cell modalities with a VAE and a latent SDE"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "torch>=2.2",
    "openTSNE",
    "PyYAML",
]

[project.optional-dependencies]
tutorial = ["umap-learn", "matplotlib", "jupyter"]

[tool.setuptools.packages.find]
include = ["mtvae*"]
