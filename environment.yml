# The stack the paper's fits were run with (Linux, one NVIDIA GPU, CUDA 12.8).
# Bit-for-bit reproduction of the released fits needs these versions.
#   conda env create -f environment.yml && conda activate mtvae
name: mtvae
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - numpy==2.1.2
      - scipy==1.18.0
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - openTSNE==1.0.4
      - PyYAML==6.0.3
      # tutorial and figures
      - umap-learn==0.5.12
      - matplotlib==3.11.1
      - jupyter
      - -e .
