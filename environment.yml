# The stack the paper's fits and benchmark scores were run with (Linux, one NVIDIA GPU,
# CUDA 12.8). Bit-for-bit reproduction of the released fits and scores needs these versions.
#   conda env create -f environment.yml && conda activate mtvae
name: mtvae
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - numpy==2.1.2
      - scipy==1.18.0
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - openTSNE==1.0.4
      - PyYAML==6.0.3
      # benchmark scorer (benchmark/score.py)
      - scanpy==1.12.3
      - anndata==0.13.2
      - igraph==1.0.0
      - leidenalg==0.12.0
      - dcor==0.7
      # tutorial and figures
      - umap-learn==0.5.12
      - matplotlib==3.11.1
      - jupyter
      - -e .
